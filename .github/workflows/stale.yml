name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.

            If this issue is still relevant, please leave a comment or remove the
            stale label. Thank you for your contributions!
          close-issue-message: |
            This issue was closed because it has been inactive for 14 days since
            being marked as stale. Please reopen if this is still a concern.
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.

            Please update the PR or leave a comment to keep it open. Thank you!
          close-pr-message: |
            This PR was closed because it has been inactive for 7 days since
            being marked as stale.
          stale-issue-label: "stale"
          close-issue-label: "closed-stale"
          stale-pr-label: "stale"
          close-pr-label: "closed-stale"
          exempt-issue-labels: "pinned,security,good first issue,help wanted,enhancement"
          exempt-pr-labels: "pinned,security,in-progress"
          exempt-all-milestones: true
          operations-per-run: 100
