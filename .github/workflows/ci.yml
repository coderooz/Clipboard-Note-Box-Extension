name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

jobs:
  validate-manifest:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
            const manifest = require('./manifest.json');
            const required = ['manifest_version', 'name', 'version', 'description'];
            const missing = required.filter(k => !manifest[k]);
            if (missing.length) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            if (manifest.manifest_version !== 3) {
              console.error('Manifest version must be 3');
              process.exit(1);
            }
            console.log('Manifest is valid:', manifest.name, 'v' + manifest.version);
          "

  lint-javascript:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install --no-save eslint

      - name: Run ESLint
        run: npx eslint background.js popup.js --no-error-on-unmatched-pattern || true

  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML structure
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('popup.html', 'utf8');
            if (!html.includes('<!DOCTYPE html>')) {
              console.error('Missing DOCTYPE declaration');
              process.exit(1);
            }
            if (!html.includes('<meta charset=')) {
              console.error('Missing charset meta tag');
              process.exit(1);
            }
            console.log('HTML structure is valid');
          "

  check-icons:
    name: Check Extension Icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify icon files
        run: |
          for size in 16 48 128; do
            if [ ! -f "icons/icon${size}.png" ]; then
              echo "Missing icon: icons/icon${size}.png"
              exit 1
            fi
          done
          echo "All required icons present"

  summary:
    name: CI Summary
    needs: [validate-manifest, lint-javascript, validate-html, check-icons]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate-manifest.result }}" = "failure" ] || \
             [ "${{ needs.lint-javascript.result }}" = "failure" ] || \
             [ "${{ needs.validate-html.result }}" = "failure" ] || \
             [ "${{ needs.check-icons.result }}" = "failure" ]; then
            echo "CI checks failed"
            exit 1
          fi
          echo "All CI checks passed"
